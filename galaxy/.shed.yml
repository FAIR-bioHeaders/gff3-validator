name: gff3_validator
owner: iuc
categories:
  - Sequence Analysis
  - Genome annotation
description: Validate GFF3 files against the GFF3 1.26 specification
long_description: |
  gff3-validator checks GFF3 annotation files against the GFF3 1.26
  specification: syntax, attributes, directives and feature structure (IDs,
  Parent references, cycles, sequence regions) and, with a genome FASTA, CDS
  phase, start and stop codons, internal stops and strand consistency. Every
  finding cites a numbered rule with a suggested fix. Reports are HTML, JSON
  and SARIF. Built by FAIR-bioHeaders with the Sequence Ontology group.
homepage_url: https://github.com/FAIR-bioHeaders/gff3-validator
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/gff3_validator
type: unrestricted
