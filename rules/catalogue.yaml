# gff3-validator rule catalogue (FHR-Specification #62).
#
# DRAFT for review with the Sequence Ontology group. Rule ids are proposals and
# may still change before the first release; after it they are stable (retired
# ids are never reused). Edit this file, then run scripts/render_rules.py.
#
# Fields: id, level (error|warning|info), layer (core|so|biology|fhgff3),
# title, description, reference ({source, anchor, section}), example (a bad
# input; "\t" is a tab), fix, status (implemented|planned), review, and
# optionally needs_so (true when the rule cannot be settled without SO input),
# notes (ambiguities and open questions) and valid (a related valid input).
#
# Layers: core = GFF3 1.26 syntax, directives and structure; so = Sequence
# Ontology terms and relationships; biology = optional checks that need
# --genome; fhgff3 = the optional FAIR-bioHeaders header. Repository profiles
# (#70) will be separate catalogues layered on top.

catalogue_version: 0.1.0-draft
date: 2026-10-08
sources:
  gff3:
    title: GFF3 specification 1.26 (18 August 2020)
    url: https://github.com/The-Sequence-Ontology/Specifications/blob/fe73505276dd324bf6a55773f3413fe2bed47af4/gff3.md
  so:
    title: Sequence Ontology so.obo data-version 2026-08-07 (SO-Ontologies commit 4340c14), bundled with the validator (question 13)
    url: https://github.com/The-Sequence-Ontology/SO-Ontologies/blob/4340c143bac3578bba0c013d02e8c5f0e51ad14a/Ontology_Files/so.obo
  fhr-format:
    title: FAIR-bioHeaders format rules R1 to R10 (docs/FORMAT.md)
    url: https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/docs/FORMAT.md
  spec007:
    title: FHR-Specification spec 007, GFF3 annotation header (FHGFF3)
    url: https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/specs/007-gff3-header/spec.md
  spec009:
    title: FHR-Specification spec 009, GFF3 validator
    url: https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/specs/009-gff3-validator/spec.md

rules:

# --------------------------------------------------------------------------
# Syntax: file, lines and columns 1 to 8
# --------------------------------------------------------------------------

- id: GFF-SYN-001
  level: error
  layer: core
  title: 'First line is the ##gff-version 3 directive'
  description: >-
    The ##gff-version directive must be present and must be the topmost line of
    the file. The version is 3, optionally followed by .major and .minor
    revision numbers (3, 3.1, 3.1.26).
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##gff-version"}
  example: "# made by mytool\n##gff-version 3"
  valid: "##gff-version 3"
  fix: Put "##gff-version 3" on the first line, before any comment or header line.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification says "3.#.#" with optional revision numbers, and its own
    examples write "##gff-version 3.1.26", which reads as the specification
    revision; older tools (the Perl validator, GFF3toolkit) accept only "3".
    The validator accepts 3, 3.N and 3.N.N. Is "3.1.26" meant to be written by
    producers, and must the revision numbers be checked? A UTF-8 byte order mark
    before "##" also fails this rule (the specification does not mention BOMs).

- id: GFF-SYN-002
  level: error
  layer: core
  title: 'Only one ##gff-version directive'
  description: 'The ##gff-version directive appears once, on the first line.'
  reference: {source: gff3, anchor: change-log, section: "Change Log 1.21: the ##gff-version pragma only appears once"}
  example: "##gff-version 3\nctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1\n##gff-version 3"
  fix: Remove the repeated directive. If two files were concatenated, split them or merge them with a GFF3-aware tool.
  status: implemented
  review: pending-SO

- id: GFF-SYN-003
  level: error
  layer: core
  title: Feature lines have nine tab-separated columns
  description: >-
    A line that is not blank, a comment (#) or a directive (##) is a feature
    line with exactly nine columns separated by single tab characters. Spaces
    do not separate columns.
  reference: {source: gff3, anchor: description-of-the-format, section: Description of the Format}
  example: "ctg1 . gene 1 90 . + . ID=g1"
  fix: Separate the nine columns with tabs; replace a missing column by ".".
  status: implemented
  review: pending-SO
  notes: >-
    A trailing tab gives ten columns (the last empty) and fails this rule; some
    tools tolerate it. Blank lines are ignored as the specification asks.

- id: GFF-SYN-004
  level: error
  layer: core
  title: Undefined columns are ".", not empty
  description: A column with no value contains a single "." character; an empty column is not allowed.
  reference: {source: gff3, anchor: description-of-the-format, section: "Description of the Format: undefined fields are replaced with the '.' character"}
  example: "ctg1\t\tgene\t1\t90\t.\t+\t.\tID=g1"
  fix: Write "." in the empty column.
  status: implemented
  review: pending-SO
  notes: >-
    The source column (2) is free text: the validator applies no character set
    to it (the Perl validator did), only the encoding rules GFF-SYN-005 and
    GFF-SYN-008.

- id: GFF-SYN-005
  level: error
  layer: core
  title: No unescaped control characters
  description: >-
    Tab (outside column separators), newline, carriage return and other control
    characters (0x00 to 0x1F, 0x7F) must be percent-encoded.
  reference: {source: gff3, anchor: description-of-the-format, section: "Description of the Format: escaping"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Note=first\rsecond"
  fix: Percent-encode the character (for example %09 for tab, %0D for carriage return).
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification does not address line endings. Are CRLF files invalid (the
    CR is an unescaped control character in column 9) or should a CRLF
    terminator be accepted? Proposal: report CRLF once per file as an error
    under this rule. Until SO answers, the validator reports control characters
    inside a line and does not report a carriage return immediately before the
    line feed (a CRLF line ending), which it removes before checking the line.

- id: GFF-SYN-006
  level: warning
  layer: core
  title: File is UTF-8
  description: UTF-8 is the only recommended character encoding (since 1.26).
  reference: {source: gff3, anchor: description-of-the-format, section: "Description of the Format: use of UTF-8 is recommended"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Note=caf\\xe9 (Latin-1 byte)"
  fix: Re-encode the file as UTF-8.
  status: implemented
  review: pending-SO
  notes: >-
    Reported once per file, at the first line that is not valid UTF-8, with the
    number of further such lines. Invalid bytes are replaced by U+FFFD for the
    other checks.

- id: GFF-SYN-007
  level: info
  layer: core
  title: Possible end-of-line comment
  description: >-
    End-of-line comments are not allowed. A "#" in a feature or directive line
    is data; text such as " # comment" at the end of column 9 is probably a
    misplaced comment.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: end-of-line comments are not allowed"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1 # check this"
  fix: Move the comment to its own line starting with "#".
  status: implemented
  review: pending-SO
  notes: >-
    Heuristic; "#" is a legal character in values, so this is info only. Checked
    in column 9 only: whitespace followed by "#".

- id: GFF-SYN-008
  level: error
  layer: core
  title: Percent-encoding is well formed
  description: A "%" must start a percent-encoded octet, "%" followed by two hexadecimal digits (RFC 3986). A literal percent sign is written %25.
  reference: {source: gff3, anchor: description-of-the-format, section: "Description of the Format: RFC 3986 percent-encoding"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Note=50% identity"
  fix: Write a literal percent sign as %25.
  status: implemented
  review: pending-SO
  notes: >-
    Backslash escapes and "+" for space are not allowed, but cannot be told
    apart from literal text; they are not checked. Checked in all nine columns.

- id: GFF-SYN-009
  level: warning
  layer: core
  title: Characters encoded that need not be
  description: >-
    Only tab, newline, carriage return, percent and control characters (and, in
    column 9, the reserved characters ; = & ,) are to be encoded; "no other
    characters may be encoded".
  reference: {source: gff3, anchor: description-of-the-format, section: "Description of the Format: escaping"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Name=EDEN%2D1"
  fix: Write the character literally (here "-").
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Conflicts with column 1, where characters outside [a-zA-Z0-9.:^*$@!+_?-|]
    "must" be escaped, and with Target, where spaces in target ids are escaped
    as %20. Proposal: allow any encoding in column 1 and in Target ids, warn
    elsewhere. Is over-encoding an error, a warning, or allowed? Implemented as
    the proposal while question 3 is open: in column 1 only encoding a character
    of the seqid set is reported, %20 is allowed in Target values, and other
    encoded characters (including UTF-8 octets of non-ASCII characters) are
    reported. Reported once per file, at the first occurrence, with a count.

- id: GFF-SYN-010
  level: error
  layer: core
  title: seqid uses the allowed characters
  description: >-
    The seqid (column 1) may contain any characters but must escape those not
    in [a-zA-Z0-9.:^*$@!+_?-|]. It may not contain unescaped whitespace and
    must not begin with an unescaped ">".
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 1: seqid"}
  example: "chr 1\t.\tgene\t1\t90\t.\t+\t.\tID=g1"
  fix: Percent-encode the character (here "chr%201") or rename the sequence consistently in the genome too.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Read as a regular-expression class, "?-|" would be a character range; the
    validator reads the list literally (? - | as three characters). Widely used
    seqids contain "#" or "=" (for example some assembly names); escaping them
    breaks the link to the FASTA name. Confirm the literal reading and whether
    escaped seqids must match escaped or decoded FASTA ids. Implemented for
    unescaped whitespace only. The character set is not checked until SO answers
    question 3. A seqid beginning with ">" cannot be told apart from a FASTA
    header: the line starts an implied FASTA section (GFF-DIR-005).

- id: GFF-SYN-011
  level: error
  layer: core
  title: seqid is defined
  description: The seqid is the landmark for the coordinates and cannot be undefined (".").
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 1: seqid"}
  example: ".\t.\tgene\t1\t90\t.\t+\t.\tID=g1"
  fix: Give the name of the sequence the coordinates refer to.
  status: planned
  review: pending-SO
  needs_so: true
  notes: >-
    Not stated explicitly; follows from the definition of seqid. The Perl
    validator treats "." as an error. Confirm.

- id: GFF-SYN-012
  level: error
  layer: core
  title: type is defined
  description: The type (column 3) is required; "." is not a valid type. Term validity is checked by the SO rules.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 3: type"}
  example: "ctg1\t.\t.\t1\t90\t.\t+\t.\tID=g1"
  fix: Give a Sequence Ontology term name or accession.
  status: implemented
  review: pending-SO

- id: GFF-SYN-013
  level: error
  layer: core
  title: start and end are integers
  description: Columns 4 and 5 are positive 1-based integer coordinates, written as decimal digits.
  reference: {source: gff3, anchor: description-of-the-format, section: "Columns 4 & 5: start and end"}
  example: "ctg1\t.\tgene\t1.0\t9e1\t.\t+\t.\tID=g1"
  fix: Write the coordinates as whole numbers, for example 1 and 90.
  status: implemented
  review: pending-SO
  notes: >-
    The validator accepts only ASCII digits: a leading "+" sign or "." is an
    error. Leading zeros ("0100") are accepted; confirm.

- id: GFF-SYN-014
  level: error
  layer: core
  title: start is at least 1
  description: Coordinates are 1-based, so start and end are 1 or more.
  reference: {source: gff3, anchor: description-of-the-format, section: "Columns 4 & 5: start and end"}
  example: "ctg1\t.\tgene\t0\t90\t.\t+\t.\tID=g1"
  fix: Convert 0-based coordinates (as in BED) to 1-based by adding 1 to start.
  status: implemented
  review: pending-SO

- id: GFF-SYN-015
  level: error
  layer: core
  title: start is not greater than end
  description: >-
    Start is always less than or equal to end, whatever the strand. For a
    feature crossing the origin of a circular sequence, end is given as the
    position past the origin plus the length of the landmark.
  reference: {source: gff3, anchor: description-of-the-format, section: "Columns 4 & 5: start and end"}
  example: "ctg1\t.\tgene\t90\t1\t.\t-\t.\tID=g1"
  fix: Swap start and end; give the orientation in the strand column.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Zero-length features (insertion sites) have start equal to end, with the
    site to the right of the indicated base; there is then no way to tell a
    zero-length feature from a one-base feature. Should SO types such as
    insertion_site be checked for this convention?

- id: GFF-SYN-016
  level: error
  layer: core
  title: score is a number or "."
  description: The score (column 6) is a floating point number, or "." when undefined.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 6: score"}
  example: "ctg1\tblastn\tmatch\t1\t90\thigh\t+\t.\tID=m1"
  fix: Write a number (for example 0.5, 12, 1e-10) or ".".
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    "Floating point" is not defined further. The validator accepts decimal
    numbers with optional sign, fraction and exponent (1, -1.5, .5, 5., 1e-10,
    1E+10) and rejects "nan", "inf" and hexadecimal. Confirm the grammar.

- id: GFF-SYN-017
  level: error
  layer: core
  title: strand is +, -, . or ?
  description: Strand (column 7) is "+" or "-" relative to the landmark, "." for features that are not stranded, or "?" when strandedness is relevant but unknown.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 7: strand"}
  example: "ctg1\t.\tgene\t1\t90\t.\t1\t.\tID=g1"
  fix: Use + or -, or "." for unstranded and "?" for unknown.
  status: implemented
  review: pending-SO

- id: GFF-SYN-018
  level: error
  layer: core
  title: phase is 0, 1, 2 or "."
  description: The phase (column 8) is one of the integers 0, 1 or 2, or "." when not defined.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 8: phase"}
  example: "ctg1\t.\tCDS\t1\t90\t.\t+\t3\tID=c1"
  fix: Use 0, 1 or 2 (bases to skip from the 5' end of this CDS segment to the first full codon).
  status: implemented
  review: pending-SO

- id: GFF-SYN-019
  level: error
  layer: core
  title: CDS features have a phase
  description: The phase is required for all CDS features.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 8: phase; Canonical Gene NOTE 4"}
  example: "ctg1\t.\tCDS\t1\t90\t.\t+\t.\tID=c1;Parent=t1"
  fix: Give the phase (0, 1 or 2) of each CDS segment.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Applied to type "CDS" and accession SO:0000316. Does it also apply to SO
    subtypes of CDS (for example CDS_fragment, edited_CDS)? The
    specification's own single-exon and polycistronic examples write CDS lines
    with phase "."; they are placeholders (XXXX coordinates) but are copied by
    users. With the SO layer, applied as proposed in question 6 to the label
    and accession of CDS and of every is_a subtype of CDS in the SO release
    (for example CDS_predicted, edited_CDS); a case variant such as "cds" is
    SO-005, not this rule.

- id: GFF-SYN-020
  level: warning
  layer: core
  title: phase is "." on features other than CDS
  description: Phase is defined only for CDS features; other features normally have ".".
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 8: phase"}
  example: "ctg1\t.\texon\t1\t90\t.\t+\t0\tParent=t1"
  fix: Use "." for the phase of features that are not CDS.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification does not forbid it. GTF-derived files put a phase on
    start_codon and stop_codon. Is a phase on non-CDS features an error, a
    warning, or allowed? Implemented as proposed in question 6, as a warning,
    for types the SO layer resolves to a current term that is not CDS or an
    is_a subtype of it; unknown and obsolete types are not judged. Reported
    once per type, at the first line, with a count.

# --------------------------------------------------------------------------
# Attributes (column 9)
# --------------------------------------------------------------------------

- id: GFF-ATT-001
  level: error
  layer: core
  title: Attributes are tag=value pairs separated by semicolons
  description: >-
    Column 9 is "." or a list of tag=value pairs separated by ";". Each pair has
    one "=" separating a tag from its value.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: attributes"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID g1; Name EDEN"
  fix: Write tag=value pairs (ID=g1;Name=EDEN). This is GTF syntax; convert GTF with a converter rather than by hand.
  status: implemented
  review: pending-SO

- id: GFF-ATT-002
  level: error
  layer: core
  title: Tags and values are not empty
  description: Every pair has a non-empty tag and a non-empty value.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: attributes"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;=EDEN"
  fix: Give the tag, or remove the pair.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification does not say values must be non-empty; the Perl validator
    and GFF3toolkit treat empty values as errors. Is "Note=" an error, a
    warning, or valid? Until SO answers question 4, only an empty tag ("=value")
    is reported; empty values ("Note=", "Parent=a,,b") are not.

- id: GFF-ATT-003
  level: info
  layer: core
  title: Empty attribute pair or trailing semicolon
  description: An empty pair (";;") or a trailing ";" carries no data.
  reference: {source: gff3, anchor: circular-genomes, section: "Circular Genomes (example ends with ';')"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;;Name=EDEN;"
  fix: Remove the extra semicolons (optional).
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification's own circular-genome example ends column 9 with ";" so a
    trailing semicolon appears to be allowed. Confirm that both are valid. Info
    only, so it never affects validity; reported once per file, at the first
    occurrence, with a count.

- id: GFF-ATT-004
  level: error
  layer: core
  title: Each tag appears once per line
  description: Multiple values of a tag are separated by commas within one pair, not by repeating the tag.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: multiple attributes of the same type"}
  example: "ctg1\t.\texon\t1\t90\t.\t+\t.\tParent=t1;Parent=t2"
  fix: Join the values with a comma (Parent=t1,t2).
  status: implemented
  review: pending-SO
  notes: Implied by the specification and enforced by the Perl validator and GFF3toolkit.

- id: GFF-ATT-005
  level: error
  layer: core
  title: Reserved characters are escaped in tags and values
  description: >-
    In column 9 ";", "=", "&" and "," have reserved meanings and must be
    escaped (%3B, %3D, %26, %2C) when used in a tag or value. Tags are case
    sensitive.
  reference: {source: gff3, anchor: description-of-the-format, section: "Description of the Format: reserved characters in column 9"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Note=a=b & c"
  fix: Escape the characters (Note=a%3Db %26 c).
  status: implemented
  review: pending-SO
  notes: >-
    "&" has no syntactic role in GFF3 but is still reserved. Comma handling is
    in GFF-ATT-006. An unescaped ";" cannot be detected, since it splits the
    pair. A "," in a tag is reported here; commas in values are GFF-ATT-006.

- id: GFF-ATT-006
  level: error
  layer: core
  title: Single-valued reserved tags have one value
  description: >-
    Only Parent, Alias, Note, Dbxref and Ontology_term can have multiple
    comma-separated values. A comma in the value of another reserved tag (ID,
    Name, Target, Gap, Derives_from, Is_circular) must be escaped as %2C.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: multiple values; Change Log 1.19"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1,g2"
  fix: Use one value (and a separate feature for the second ID), or escape the comma.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Derives_from is not in the multi-valued list (1.19), yet a feature can
    derive from several (the polycistronic and trans-splicing examples use one
    Derives_from per line). Is Derives_from=g1,g2 allowed? For lower-case
    (application) tags, is an unescaped comma a value separator or literal text?
    The validator will not interpret commas in application tags. Implemented for
    ID, Name, Target, Gap and Is_circular. Derives_from is not checked until
    question 5 is answered; for GFF-STR-005 its commas are read as separators.

- id: GFF-ATT-007
  level: warning
  layer: core
  title: Unknown reserved (upper-case) tag
  description: >-
    Tags beginning with an upper-case letter are reserved. Only ID, Name, Alias,
    Parent, Target, Gap, Derives_from, Note, Dbxref, Ontology_term and
    Is_circular are defined.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: all attributes that begin with an uppercase letter are reserved"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Gene_biotype=protein_coding"
  fix: Use a lower-case tag for application data (gene_biotype=protein_coding).
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Common in practice (GVF tags such as Variant_seq, mirGFF3 Variant/Cigar,
    NCBI "Is_pseudo"?). Should known extensions (GVF, mirGFF3) be recognized by
    profile rather than warned about? Implemented as a warning for any tag
    beginning with an upper-case letter that is not reserved and is not a case
    variant of a reserved tag (that is GFF-ATT-008).

- id: GFF-ATT-008
  level: warning
  layer: core
  title: Tag differs from a reserved tag only by case
  description: Tags are case sensitive; "parent" is not "Parent", so a lower-case reserved name is an application tag and has no effect.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: attribute names are case sensitive"}
  example: "ctg1\t.\texon\t1\t90\t.\t+\t.\tparent=t1"
  fix: Use the reserved spelling (Parent=t1) if a part-of relationship was meant.
  status: implemented
  review: pending-SO
  notes: >-
    The specification's own pathological-case examples write "name=resA";
    that is valid (an application tag) but probably meant Name.

- id: GFF-ATT-009
  level: info
  layer: core
  title: Quoted attribute value
  description: Values should not be quoted; quotes are part of the value.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: attribute values do not need to be and should not be quoted"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Dbxref=\"EMBL:AA816246\""
  fix: Remove the quotes unless they belong to the value.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The Ontology Associations section shows Dbxref="EMBL:AA816246" with quotes.
    Are those examples meant literally? A value that starts and ends with a
    double quote is reported; info only, once per file, at the first occurrence,
    with a count.

- id: GFF-ATT-010
  level: error
  layer: core
  title: Target has the form "target_id start end [strand]"
  description: >-
    Target values are a target id, start and end (positive integers, start <=
    end) and an optional strand "+" or "-", separated by spaces. Spaces in the
    target id are escaped as %20.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: Target; Alignments"}
  example: "ctg1\t.\tcDNA_match\t1050\t1500\t.\t+\t.\tID=m1;Target=cdna0123+12+462"
  fix: Separate target_id, start and end by spaces, escape spaces in target_id as %20, and give the strand as + or - (Target=cdna0123 12 462 +).
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The ##FASTA example writes Target=cdna0123+12+462 ("+" for space), which the
    specification otherwise forbids; it fails this rule. Implemented for the
    stated form: three or four fields separated by spaces (runs of spaces are
    accepted), positive integer start and end, strand + or -. Until SO answers,
    start > end within Target is not reported (the Alignments section says
    orientation goes in column 7 "and not by changing the order of the start and
    end positions"), and a strand on a protein target is accepted.

- id: GFF-ATT-011
  level: error
  layer: core
  title: Gap is a list of operations
  description: Gap is a space-separated list of operations, each a code M, I, D, F or R followed by a positive length (for example "M8 D3 M6 I1 M6").
  reference: {source: gff3, anchor: the-gap-attribute, section: The Gap Attribute}
  example: "chr3\t.\tmatch\t1\t23\t.\t.\t.\tID=m1;Target=EST23 1 21;Gap=8M3D6M"
  fix: Write the code before the length (M8 D3 M6); this is not SAM CIGAR order.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The Perl validator also accepted lower-case codes. Are lower-case codes and
    multiple spaces valid? Until SO answers, only the upper-case codes are
    accepted, runs of spaces between operations are accepted, and a zero length
    is reported.

- id: GFF-ATT-012
  level: warning
  layer: core
  title: Gap is given with Target
  description: The Gap attribute describes the alignment of the feature to its Target, so a Gap without a Target cannot be interpreted.
  reference: {source: gff3, anchor: the-gap-attribute, section: The Gap Attribute}
  example: "chr3\t.\tmatch\t1\t23\t.\t.\t.\tID=m1;Gap=M8 D3 M6 I1 M6"
  fix: Add the Target attribute.
  status: implemented
  review: pending-SO
  needs_so: true

- id: GFF-ATT-013
  level: warning
  layer: core
  title: Gap lengths agree with the feature and Target lengths
  description: >-
    For nucleotide alignments, M + D lengths equal the feature length and M + I
    lengths equal the Target length; for protein-to-nucleotide matches, M, I
    and D count residues (three bases each) and F, R count bases.
  reference: {source: gff3, anchor: the-gap-attribute, section: The Gap Attribute}
  example: "chr3\t.\tmatch\t1\t30\t.\t.\t.\tID=m1;Target=EST23 1 21;Gap=M8 D3 M6 I1 M6"
  fix: Correct the coordinates or the Gap string so they describe the same alignment.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Which types are protein-to-nucleotide (nucleotide_to_protein_match,
    protein_match and subtypes?) must come from SO. For multi-line matches,
    lengths apply per line. Implemented without SO: a line is accepted if either
    reading fits, nucleotide (no F or R; M + D = feature length; M + I = Target
    length) or protein (3 x (M + D) + F - R = feature length; M + I = Target
    length), and a warning is given when neither does. Checked only when Target
    and Gap are well formed.

- id: GFF-ATT-014
  level: error
  layer: core
  title: Dbxref and Ontology_term values are DBTAG:ID
  description: Each value has a database tag, a colon and an identifier; split on the first colon, so the DBTAG contains no colon and the ID may.
  reference: {source: gff3, anchor: ontology-associations-and-db-cross-references, section: Ontology Associations and DB Cross References}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Dbxref=AA816246"
  fix: Prefix the identifier with its database tag (Dbxref=EMBL:AA816246).
  status: implemented
  review: pending-SO

- id: GFF-ATT-015
  level: info
  layer: core
  title: DBTAG is a registered database abbreviation
  description: The DBTAG should come from the GO database cross-reference registry named by the specification.
  reference: {source: gff3, anchor: ontology-associations-and-db-cross-references, section: Ontology Associations and DB Cross References}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1;Dbxref=MyLab:123"
  fix: Use a registered abbreviation where one exists.
  status: planned
  review: pending-SO
  needs_so: true
  notes: >-
    The specification points to ftp://ftp.geneontology.org/pub/go/doc/GO.xrf_abbs,
    which is no longer served; GO now publishes db-xrefs.yaml. Which registry
    (or Bioregistry prefixes) should be pinned, and is this worth checking?

- id: GFF-ATT-016
  level: warning
  layer: core
  title: Is_circular is "true"
  description: Is_circular is a flag; the specification uses the value "true".
  reference: {source: gff3, anchor: circular-genomes, section: Circular Genomes}
  example: "J02448\tGenBank\tregion\t1\t6407\t.\t+\t.\tID=J02448;Is_circular=yes"
  fix: Write Is_circular=true, or remove the attribute for a linear sequence.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Is Is_circular=false valid (meaning linear), or must the tag be absent?
    Until SO answers, Is_circular=false is not reported; any value other than
    true and false is.

- id: GFF-ATT-017
  level: info
  layer: core
  title: Is_circular is on the landmark feature
  description: Is_circular marks the landmark (a feature covering the whole sequence named in column 1), not features on it.
  reference: {source: gff3, anchor: circular-genomes, section: Circular Genomes}
  example: "J02448\tGenBank\tCDS\t6006\t7238\t.\t+\t0\tID=geneII;Is_circular=true"
  fix: Put Is_circular=true on a region feature spanning the whole sequence.
  status: planned
  review: pending-SO
  needs_so: true
  notes: >-
    How is the landmark identified: a feature whose ID equals the seqid, one
    spanning 1..length, or a particular SO type (region, chromosome, plasmid)?

# --------------------------------------------------------------------------
# Directives
# --------------------------------------------------------------------------

- id: GFF-DIR-001
  level: error
  layer: core
  title: "##sequence-region has the form: seqid start end"
  description: The directive gives a seqid and integer start and end with 1 <= start <= end.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##sequence-region"}
  example: "##sequence-region ctg123 1497228"
  fix: "Write ##sequence-region ctg123 1 1497228."
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Must start be 1? Must the directive come before the features on that seqid,
    or may it appear anywhere (gt gff3 moves them to the top)? Until SO answers
    question 10, a start other than 1 and a directive after the features on its
    seqid are not reported. The fields are separated by whitespace.

- id: GFF-DIR-002
  level: error
  layer: core
  title: 'One ##sequence-region per seqid'
  description: 'Only one ##sequence-region directive may be given for any seqid.'
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##sequence-region"}
  example: "##sequence-region ctg1 1 1000\n##sequence-region ctg1 1 2000"
  fix: Keep one directive covering the whole region.
  status: implemented
  review: pending-SO
  notes: An exact repeat (same bounds) could be a warning; proposal keeps it an error as the text says.

- id: GFF-DIR-003
  level: error
  layer: core
  title: "### closes all forward references"
  description: >-
    "###" declares that all forward references to feature IDs seen so far are
    resolved. A Parent or Derives_from seen before "###" must refer to an ID
    that also appears before it, and features after it should not add parts to
    features before it.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ###"}
  example: "ctg1\t.\tmRNA\t1\t90\t.\t+\t.\tID=t1;Parent=g1\n###\nctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1"
  fix: Move "###" after the features it closes, or put parents before it.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The text says forward references are resolved; it does not say whether a
    later line may still name an earlier ID as Parent, or continue a
    discontinuous feature (same ID) after "###". Streaming readers close objects
    at "###", so both break them. Error or warning? Implemented for the part the
    text states: a Parent or Derives_from seen before ### that names an ID first
    defined after it (reported at the first such reference). Until SO answers
    question 9, a later line naming an earlier ID, and the continuation of a
    discontinuous feature after ###, are not reported. An ID that is never
    defined is GFF-STR-004 or GFF-STR-005 instead.

- id: GFF-DIR-004
  level: error
  layer: core
  title: 'Only FASTA after ##FASTA'
  description: >-
    After ##FASTA the rest of the file is one or more FASTA records; no feature
    lines or other content may follow.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##FASTA"}
  example: "##FASTA\n>ctg1\nACGT\nctg1\t.\tgene\t1\t4\t.\t+\t.\tID=g1"
  fix: 'Move all feature lines before ##FASTA.'
  status: implemented
  review: pending-SO
  notes: >-
    Are blank lines and "#" comments allowed inside the FASTA section? Feature
    lines (lines with a tab) and "##" directives after ##FASTA are reported;
    blank lines and "#" comment lines are not, until SO answers.

- id: GFF-DIR-005
  level: warning
  layer: core
  title: 'FASTA section starts with ##FASTA'
  description: 'A line beginning with ">" implies a ##FASTA directive (kept for Artemis compatibility); writing ##FASTA is clearer.'
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##FASTA (implied by a line beginning with >)"}
  example: "ctg1\t.\tgene\t1\t4\t.\t+\t.\tID=g1\n>ctg1\nACGT"
  fix: 'Insert a ##FASTA line before the first sequence.'
  status: implemented
  review: pending-SO

- id: GFF-DIR-006
  level: warning
  layer: core
  title: FASTA records are well formed
  description: Each record has a ">" header with an id, at least one sequence line, and ids are unique.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##FASTA"}
  example: "##FASTA\n>ctg1\n>ctg2\nACGT"
  fix: Give each sequence a unique id and its sequence lines.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Which alphabet is accepted (IUPAC nucleotides, amino acids, lower case, "*",
    "-")? Is the FASTA id the first word of the header? Implemented without an
    alphabet check: a header with no id, a repeated id, a record without
    sequence lines, and sequence lines before the first header (once) are
    reported. The id is taken as the first word of the header, as FASTA readers
    do.

- id: GFF-DIR-007
  level: warning
  layer: core
  title: "##species is an NCBI Taxonomy URL"
  description: The preferred format is an NCBI Taxonomy browser URL by id or name.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##species"}
  example: "##species Caenorhabditis elegans"
  fix: "Write ##species https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=6239."
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification gives http URLs only, as "preferred". Accept https,
    identifiers.org/NCBITaxon CURIEs (NCBITaxon:6239)? Proposal: warning only
    when the value is not a URL or CURIE. Until SO answers, anything other than
    the two NCBI Taxonomy browser URL forms (http or https) is reported,
    including NCBITaxon CURIEs.

- id: GFF-DIR-008
  level: warning
  layer: core
  title: "##genome-build has a source and a build name"
  description: The directive gives the source of the assembly and its build name.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##genome-build"}
  example: "##genome-build GRCh38"
  fix: "Give both, for example ##genome-build NCBI GRCh38.p14."
  status: implemented
  review: pending-SO
  notes: >-
    An FHGFF3 header records the genome more precisely (checksum, accession,
    SeqCol). Reported when fewer than two values are given; the content is not
    checked.

- id: GFF-DIR-009
  level: info
  layer: core
  title: Ontology directives are recorded but not fetched
  description: >-
    ##feature-ontology, ##attribute-ontology and ##source-ontology name ontologies
    by URI. The validator never fetches URIs during validation; types are
    checked against the pinned SO release and the directive is reported.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##feature-ontology, ##attribute-ontology, ##source-ontology"}
  example: "##feature-ontology http://song.cvs.sourceforge.net/viewvc/*checkout*/song/ontology/so.obo?revision=1.263"
  fix: None needed; to use another ontology, supply it locally (planned option).
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The release URIs in the specification (SourceForge CVS) are dead. Should
    the specification list current SO release URIs (PURLs with version), and
    how should a file that names an old release be validated? As proposed in
    question 13, ##feature-ontology is validated against the release in use
    (bundled, or --so), and the note names it.

- id: GFF-DIR-010
  level: info
  layer: core
  title: Unknown directive
  description: Application-specific directives are allowed and need not be supported; unknown ones are reported for information.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: directives"}
  example: "##date 2026-10-08"
  fix: None needed.
  status: implemented
  review: pending-SO
  notes: >-
    Directives defined elsewhere (GVF ##file-version, ##reference-fasta) could
    be listed as known by profile.

# --------------------------------------------------------------------------
# Structure: IDs and references
# --------------------------------------------------------------------------

- id: GFF-STR-001
  level: error
  layer: core
  title: IDs are unique, except for the lines of one discontinuous feature
  description: >-
    IDs must be unique within the file. The same ID may appear on several lines
    only when those lines collectively represent a single discontinuous feature
    (for example the segments of a CDS or a cDNA_match). Lines sharing an ID
    with different types are two features with one ID.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 9: ID; Change Log 1.20"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=x1\nctg1\t.\tmRNA\t1\t90\t.\t+\t.\tID=x1;Parent=x1"
  valid: "ctg1\t.\tCDS\t1\t30\t.\t+\t0\tID=c1;Parent=t1\nctg1\t.\tCDS\t61\t90\t.\t+\t0\tID=c1;Parent=t1"
  fix: Give each feature its own ID.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification does not say what lines of one feature must share.
    Proposal: same type is required (error); seqid, strand and Parent
    differences are GFF-STR-002 and GFF-STR-003. Is that the intended reading?
    IDs are compared after percent-decoding; confirm. Until SO answers, lines
    sharing an ID with different types are reported (one finding per later
    line); IDs, Parent and Derives_from values are compared after percent-
    decoding.

- id: GFF-STR-002
  level: warning
  layer: core
  title: Lines of one feature share seqid and strand
  description: Lines with the same ID describe one feature; a change of seqid or strand between them is unusual.
  reference: {source: gff3, anchor: pathological-cases, section: "Pathological Cases: trans-spliced transcript"}
  example: "chr1\t.\tCDS\t1\t30\t.\t+\t0\tID=c1;Parent=t1\nchr2\t.\tCDS\t61\t90\t.\t-\t0\tID=c1;Parent=t1"
  fix: Check that the lines are parts of the same feature.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Trans-splicing between strands or chromosomes is biologically real; the
    specification's trans-splicing example stays on one strand and seqid. Should
    a change of seqid or strand be allowed, warned or an error? Implemented as a
    warning until SO answers question 8.

- id: GFF-STR-003
  level: warning
  layer: core
  title: Lines of one feature have the same Parent
  description: A single feature has one set of parents; lines with the same ID but different Parent values are probably different features.
  reference: {source: gff3, anchor: the-canonical-gene, section: The Canonical Gene}
  example: "ctg1\t.\tCDS\t1\t30\t.\t+\t0\tID=c1;Parent=t1\nctg1\t.\tCDS\t61\t90\t.\t+\t0\tID=c1;Parent=t2"
  fix: Give the features different IDs, or the same Parent list.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Can the Parent list legitimately be split across the lines of a feature (the
    union being the parents)? Implemented as a warning until SO answers. For
    GFF-STR-006 the union of the Parent lists is used.

- id: GFF-STR-004
  level: error
  layer: core
  title: Parent refers to an ID in the file
  description: >-
    Every Parent value is the ID of a feature in the same file. Forward
    references are allowed (up to "###" or the end of the file).
  reference: {source: gff3, anchor: parent-part_of-relationships, section: "Parent (part_of) Relationships"}
  example: "ctg1\t.\texon\t1\t90\t.\t+\t.\tParent=mRNA0001"
  fix: Add the parent feature, or correct the ID (IDs are case sensitive).
  status: implemented
  review: pending-SO
  notes: >-
    Checked at the end of the file; a reference that crosses a ### is GFF-
    DIR-003. One finding per missing ID, at its first reference, with the number
    of other referencing lines.

- id: GFF-STR-005
  level: error
  layer: core
  title: Derives_from refers to an ID in the file
  description: Every Derives_from value is the ID of a feature in the same file.
  reference: {source: gff3, anchor: pathological-cases, section: "Pathological Cases: polycistronic transcripts, intein"}
  example: "chrX\t.\tpolypeptide\t1\t90\t.\t+\t.\tID=p1;Derives_from=cds99"
  fix: Add the feature it derives from, or correct the ID.
  status: implemented
  review: pending-SO
  notes: >-
    Checked at the end of the file, like GFF-STR-004. Commas in Derives_from are
    read as separators (question 5).

- id: GFF-STR-006
  level: error
  layer: core
  title: No Parent cycles
  description: A set of Parent relationships that forms a cycle (including a feature that is its own parent) must be rejected.
  reference: {source: gff3, anchor: parent-part_of-relationships, section: "Parent (part_of) Relationships"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=a;Parent=b\nctg1\t.\tmRNA\t1\t90\t.\t+\t.\tID=b;Parent=a"
  fix: Remove the Parent that closes the loop.
  status: implemented
  review: pending-SO
  notes: >-
    Checked at the end of the file by an iterative depth-first search over the
    Parent graph of features with IDs (no recursion limit). A cycle is reported
    at the line of its first-defined feature.

- id: GFF-STR-007
  level: warning
  layer: core
  title: No Derives_from cycles
  description: A feature that (indirectly) derives from itself is probably an error.
  reference: {source: gff3, anchor: pathological-cases, section: "Pathological Cases"}
  example: "chrX\t.\tpolypeptide\t1\t90\t.\t+\t.\tID=p1;Derives_from=p2\nchrX\t.\tpolypeptide\t1\t90\t.\t+\t.\tID=p2;Derives_from=p1"
  fix: Remove the Derives_from that closes the loop.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification forbids Parent cycles only. Should Derives_from cycles be
    an error too? Implemented as a warning, with the same search as GFF-STR-006,
    until SO answers question 12.

- id: GFF-STR-008
  level: error
  layer: core
  title: 'Features are within their ##sequence-region'
  description: >-
    When a ##sequence-region is given for a seqid, every feature on it lies
    within that range, unless the landmark is marked Is_circular.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##sequence-region"}
  example: "##sequence-region ctg1 1 1000\nctg1\t.\tgene\t900\t1200\t.\t+\t.\tID=g1"
  fix: 'Correct the coordinates or the ##sequence-region bounds.'
  status: implemented
  review: pending-SO
  notes: >-
    For a circular landmark, the bound is presumably 2 x length (end = position
    past the origin + length); confirm. Until SO answers question 10, features
    before the directive are also checked, and when any feature on the seqid has
    Is_circular=true (which feature is the landmark is open, GFF-ATT-017) only
    the start is checked; no 2 x length bound is applied. At most 100 lines per
    seqid beyond the end are listed, then a count.

- id: GFF-STR-009
  level: info
  layer: core
  title: 'seqid without ##sequence-region'
  description: The directive is optional but strongly encouraged; when some seqids have one and others do not, the others cannot be bounds-checked.
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##sequence-region"}
  example: "##sequence-region ctg1 1 1000\nctg2\t.\tgene\t1\t90\t.\t+\t.\tID=g1"
  fix: 'Add ##sequence-region lines for all sequences (optional).'
  status: implemented
  review: pending-SO
  notes: >-
    Reported only when the file has at least one ##sequence-region; once per
    seqid, at its first feature.

- id: GFF-STR-010
  level: warning
  layer: core
  title: 'seqids appear in the ##FASTA section'
  description: 'When the file has a ##FASTA section, features normally refer to sequences in it.'
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##FASTA"}
  example: "ctg2\t.\tgene\t1\t4\t.\t+\t.\tID=g1\n##FASTA\n>ctg1\nACGT"
  fix: Add the sequence, or correct the seqid.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Not required by the specification; the FASTA section may hold only some
    sequences (for example protein Targets). Warning or info? Implemented as a
    warning, once per seqid, at its first feature. The seqid is matched as
    written, then percent-decoded (question 3).

- id: GFF-STR-011
  level: error
  layer: core
  title: Features fit within the embedded sequence
  description: 'A feature''s end is not beyond the length of its sequence in the ##FASTA section, unless the landmark is circular.'
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##FASTA"}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1\n##FASTA\n>ctg1\nACGT"
  fix: Correct the coordinates or the sequence.
  status: implemented
  review: pending-SO
  notes: >-
    Reported once per seqid, at the feature that reaches furthest. For a seqid
    with Is_circular=true only the start is checked.

- id: GFF-STR-012
  level: info
  layer: core
  title: Child extends beyond its parent
  description: >-
    GFF3 does not require features to lie within their parents (for example an
    enhancer part of a gene). Reported as information only.
  reference: {source: gff3, anchor: parent-part_of-relationships, section: "Parent (part_of) Relationships"}
  example: "ctg1\t.\tgene\t100\t200\t.\t+\t.\tID=g1\nctg1\t.\tmRNA\t50\t200\t.\t+\t.\tID=t1;Parent=g1"
  fix: None required; check the coordinates if containment was expected.
  status: planned
  review: pending-SO
  needs_so: true
  notes: >-
    Other validators treat this as an error (GFF3toolkit Ema0001/Ema0003). Could
    SO identify the types for which containment is expected (exon in
    transcript), so a warning could be given for those only?

- id: GFF-STR-013
  level: warning
  layer: core
  title: Parent and child are on the same seqid
  description: A part-of relationship across sequences is unusual.
  reference: {source: gff3, anchor: parent-part_of-relationships, section: "Parent (part_of) Relationships"}
  example: "chr1\t.\tgene\t1\t90\t.\t+\t.\tID=g1\nchr2\t.\tmRNA\t1\t90\t.\t+\t.\tID=t1;Parent=g1"
  fix: Check the seqid or the Parent.
  status: planned
  review: pending-SO
  needs_so: true
  notes: Not addressed by the specification (trans-splicing across chromosomes exists).

# --------------------------------------------------------------------------
# Sequence Ontology
# --------------------------------------------------------------------------

- id: SO-001
  level: warning
  layer: so
  title: type is an SO term name or accession
  description: >-
    The type is a term from the Sequence Ontology or an SO accession
    (SO:0000704), checked against the bundled SO release (or the so.obo given
    with --so), which every report names.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 3: type"}
  example: "ctg1\t.\tprotein_coding_gene_model\t1\t90\t.\t+\t.\tID=g1"
  fix: Use an SO term (for example gene, mRNA) or accession; see the suggestions in the message.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Exact label matching is case sensitive ("CDS"); the specification's NOTE 1
    table writes "cds". Are exact synonyms (EXACT in so.obo) acceptable as
    types? Are labels with spaces valid? Unknown types in SOFA but not SO?
    Implemented as proposed in question 14: the exact label or accession
    matches; a case variant or EXACT synonym is SO-005, not this rule; up to
    three close labels are suggested. A warning, not an error, until SO
    answers: the specification constrains the type to an SO term but does not
    say which release (question 13), and terms are renamed between releases
    (lnc_RNA, used by NCBI and Ensembl, is now lncRNA and not a synonym), and
    the specification's own Gap example uses nucleotide_to_protein_match,
    which is not an SO term. A type of "." is GFF-SYN-012 only.

- id: SO-002
  level: error
  layer: so
  title: SO accession is well formed
  description: An accession type has the form SO:NNNNNNN (seven digits).
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 3: type (SO:000000 syntax)"}
  example: "ctg1\t.\tSO:704\t1\t90\t.\t+\t.\tID=g1"
  fix: "Write the accession as SO: followed by seven digits (for example SO:0000704)."
  status: implemented
  review: pending-SO
  notes: >-
    The specification writes "SO:000000" (six zeros) as the pattern; SO
    accessions have seven digits. Any type starting with "SO:" (in any case)
    that is not SO: and seven digits is reported; a well-formed accession that
    is not in the release is SO-001.

- id: SO-003
  level: warning
  layer: so
  title: type is sequence_feature or a subtype
  description: The type must be sequence_feature (SO:0000110) or an is_a descendant of it, not, for example, an SO attribute or a variant effect term.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 3: type; Change Log 1.23"}
  example: "ctg1\t.\tcoding_sequence_variant\t1\t90\t.\t+\t.\tID=v1"
  fix: Use a located sequence feature type.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Confirm that only is_a (not part_of) descendants count, and how GVF types
    (sequence_alteration is a sequence_feature) and terms outside SOFA are
    treated. Implemented as proposed in question 14 (is_a descendants only),
    as a warning until SO confirms; obsolete terms are SO-004 instead, and
    terms outside SOFA are SO-009.

- id: SO-004
  level: warning
  layer: so
  title: type is not obsolete
  description: Obsolete SO terms are reported with their replaced_by or consider suggestions from the pinned release.
  reference: {source: so, anchor: "", section: "so.obo is_obsolete, replaced_by, consider"}
  example: "ctg1\t.\tRNA_polymerase_promoter\t1\t90\t.\t+\t.\tID=p1"
  fix: Use the suggested replacement term. The validator never rewrites the type.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    RNA_polymerase_promoter (SO:0001203) is obsolete in so.obo data-version
    2026-08-07, replaced by promoter. Implemented as proposed in question 13;
    an obsolete type is not also reported by SO-003 or SO-009.

- id: SO-005
  level: warning
  layer: so
  title: type is a synonym or case variant of an SO label
  description: The type matches an SO synonym or differs from a label only by case; the label is preferred.
  reference: {source: so, anchor: "", section: "so.obo name and synonym"}
  example: "ctg1\t.\tfive_prime_utr\t1\t90\t.\t+\t.\tParent=t1"
  fix: Use the SO label named in the message (for example five_prime_UTR for 5'UTR).
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Depends on the SO-001 decision on synonyms. Implemented as proposed in
    question 14: a type that differs from a label only by case, or that equals
    an EXACT synonym (compared ignoring case), is reported with the label. A
    unique match is then treated as that term by the other SO rules (SO-003,
    SO-004, SO-006, SO-009) but not by the CDS, exon and recoded_codon checks,
    which need the exact label or accession. A synonym of several terms lists
    them and is not checked further.

- id: SO-006
  level: warning
  layer: so
  title: Parent relationship is an SO part_of relationship
  description: >-
    Features must respect SO part-of relationships: the child's type should be
    part_of the parent's type (directly, through is_a inheritance, or by the
    transitivity of part_of, so an exon can be attached to a gene).
  reference: {source: gff3, anchor: parent-part_of-relationships, section: "Parent (part_of) Relationships; Canonical Gene NOTE 2"}
  example: "ctg1\t.\tmRNA\t1\t90\t.\t+\t.\tID=t1;Parent=e1\nctg1\t.\texon\t1\t90\t.\t+\t.\tID=e1"
  fix: Check the Parent; for example, an exon is part of a transcript, not the reverse.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    The specification says such a Parent "should trigger a parse exception",
    but SO does not enumerate every permitted annotation model (the operon
    example notes promoters could not be part_of an operon). Which relations
    and inference (part_of, member_of, has_part inverses, is_a, transitivity)
    define "allowed"? Until SO decides, this is a warning, not an error.
    Implemented as proposed in question 15: a Parent is allowed when the
    child's type, or an is_a ancestor of it, is part_of the Parent's type or
    an is_a ancestor of it, directly or through a chain of such steps. SO
    relates transcripts to genes only through gene_member_region member_of
    gene, so member_of is followed like part_of; with part_of alone the
    specification's canonical gene (mRNA Parent=gene) would be reported.
    has_part inverses are not used. Types that are unknown, ambiguous
    synonyms or obsolete are not checked. One finding per pair of child and
    Parent types, at the first line, with a count.

- id: SO-007
  level: info
  layer: so
  title: Derives_from relationship is an SO derives_from relationship
  description: The feature's type derives_from the referenced feature's type in SO (for example polypeptide derives_from mRNA or CDS).
  reference: {source: gff3, anchor: pathological-cases, section: "Pathological Cases: intein"}
  example: "chrX\t.\texon\t1\t90\t.\t+\t.\tID=e1;Derives_from=g1"
  fix: Check the relationship; use Parent for part-of.
  status: planned
  review: pending-SO
  needs_so: true
  notes: >-
    The Perl validator disabled this check. The specification's examples have
    CDS Derives_from gene and mature_polypeptide Derives_from gene, which may
    not be derives_from relations in SO. Should this be checked at all? Not
    checked, as proposed in question 16; reports list the rule as not
    checked.

- id: SO-008
  level: warning
  layer: so
  title: SO terms in Ontology_term are valid
  description: Ontology_term values with the SO prefix name terms in the pinned release (for example SO:1000069 on a frameshifted mRNA).
  reference: {source: gff3, anchor: pathological-cases, section: "Pathological Cases: programmed frameshift"}
  example: "chrX\t.\tmRNA\t1\t90\t.\t+\t.\tID=t1;Ontology_term=SO:9999999"
  fix: Use an existing SO accession.
  status: implemented
  review: pending-SO
  notes: >-
    Values with the DBTAG "SO" that are not SO: and seven digits, or not a
    term in the release, are reported once per value. Obsolete terms are
    not reported: the specification's own example, SO:1000069, is obsolete in
    so.obo data-version 2026-08-07.

- id: SO-009
  level: info
  layer: so
  title: type is outside SOFA
  description: >-
    The type is an SO term that is not in SOFA, the SO subset for feature
    annotation that GFF3 historically referenced. Such types are valid; the
    note helps tools that accept only SOFA.
  reference: {source: so, anchor: "", section: "so.obo subset SOFA"}
  example: "ctg1\t.\tprotein_coding_gene\t1\t90\t.\t+\t.\tID=g1"
  valid: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1"
  fix: None needed; use a SOFA term if a downstream tool needs one.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Added for question 13, which proposes validating against full SO with a
    note for terms outside SOFA. Reported once per type, at the first line,
    with a count.

# --------------------------------------------------------------------------
# Biology (optional; need --genome)
# --------------------------------------------------------------------------

- id: BIO-001
  level: error
  layer: biology
  title: seqid is in the genome
  description: Every seqid names a sequence in the genome supplied with --genome.
  reference: {source: spec009, anchor: requirements-mandatory, section: "FR-003, FR-005"}
  example: "Chr1\t.\tgene\t1\t90\t.\t+\t.\tID=g1   (genome has chr1)"
  fix: Use the genome the annotation was made on, or the same sequence names. The validator does not map names.
  status: implemented
  review: pending-SO
  notes: >-
    Seqids of feature lines and of ##sequence-region lines are looked up as
    written and then percent-decoded; names are never mapped (chr1 and 1
    differ). When no seqid matches, the genome is probably the wrong one: one
    BIO-001 error is reported for the file instead of one per seqid, and the
    codon checks are skipped (BIO-011), not failed.

- id: BIO-002
  level: error
  layer: biology
  title: Features fit within the genome sequence
  description: A feature's end is not beyond the length of its sequence in the genome, unless the landmark is circular.
  reference: {source: gff3, anchor: description-of-the-format, section: "Columns 4 & 5: start and end"}
  example: "chr1\t.\tgene\t1\t2000\t.\t+\t.\tID=g1   (chr1 is 1500 bp)"
  fix: Check the genome version and coordinates.
  status: implemented
  review: pending-SO
  notes: >-
    On a circular landmark (Is_circular=true) only the start must lie within the
    sequence. Reported once per seqid, for the furthest feature, as GFF-STR-011
    does for the ##FASTA section; a CDS beyond the sequence is not translated
    (BIO-011).

- id: BIO-003
  level: warning
  layer: biology
  title: "##sequence-region agrees with the genome"
  description: 'A ##sequence-region covering a whole sequence has the genome sequence''s length.'
  reference: {source: gff3, anchor: other-syntax, section: "Other Syntax: ##sequence-region"}
  example: "##sequence-region chr1 1 2000   (chr1 is 1500 bp)"
  fix: Check the genome version.
  status: implemented
  review: pending-SO
  notes: >-
    A sequence-region may cover only part of a sequence, so only a region longer
    than the sequence is certain to be wrong. Not reported for a circular
    landmark, whose bound is an open question (question 10).

- id: BIO-004
  level: warning
  layer: biology
  title: CDS phases are consistent
  description: >-
    Along a CDS (all lines with one ID, in 5' to 3' order on its strand), the
    phase of each segment follows from the previous segments' lengths and
    phases: phase(n+1) = (3 - ((length(n) - phase(n)) mod 3)) mod 3.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 8: phase"}
  example: "ctg1\t.\tCDS\t1\t31\t.\t+\t0\tID=c1\nctg1\t.\tCDS\t61\t90\t.\t+\t0\tID=c1"
  fix: Recompute phases from the segment lengths (here the second phase is 2).
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Phase is not frame. Programmed frameshifts (the specification's example
    resets phase to 0), ribosomal slippage and partial CDS at the 5' end break
    the formula; the first segment of a 5'-partial CDS may have any phase. Is
    this a warning, and which annotations exempt it? Implemented as a warning: a
    CDS is the CDS lines sharing an ID or, for lines without ID, sharing a
    Parent list (grouping by Parent alone would merge cds00003 and cds00004 of
    the canonical gene, which share mRNA00003). Segments are ordered by start on
    + and by end on -, and the first segment's phase is not judged. A CDS on
    strand . or ?, with a missing phase or with lines on different seqids or
    strands is skipped and counted in BIO-011. Segments are kept until the next
    ### or the end of the file (memory: about 40 bytes per CDS line). When
    phases are inconsistent, stop codons (BIO-007, BIO-008) are not checked,
    since the annotation then implies a frameshift.

- id: BIO-005
  level: warning
  layer: biology
  title: CDS segments lie within exons
  description: When a transcript has exon children, each CDS segment of that transcript lies within one of its exons.
  reference: {source: gff3, anchor: the-canonical-gene, section: The Canonical Gene}
  example: "ctg1\t.\texon\t100\t200\t.\t+\t.\tParent=t1\nctg1\t.\tCDS\t150\t250\t.\t+\t0\tID=c1;Parent=t1"
  fix: Correct the CDS or exon coordinates.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Does not need the genome (it could move to the structure layer) but runs
    with the biology layer. Implemented as a warning: each CDS segment is
    compared with the exons whose Parent is a Parent of the CDS, collected until
    the next ### or the end of the file. Not applicable when the exon features
    are omitted (single-exon case in Pathological Cases).

- id: BIO-006
  level: warning
  layer: biology
  title: CDS starts with a start codon
  description: >-
    When a CDS is complete, its first three bases are a start codon under the
    translation table chosen with --translation-table. Start and stop codons
    are included in the CDS.
  reference: {source: gff3, anchor: the-canonical-gene, section: "The Canonical Gene NOTE 5; Change Log 1.13"}
  example: "CDS 1..90 on +, genome bases 1..3 are CCC"
  fix: Check the CDS start; mark partial CDS as such.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    GFF3 has no standard way to mark a partial CDS (attributes such as
    partial=true or start_range are profile-specific). The table is never
    inferred from the organism. How should incompleteness be expressed?
    Implemented as a warning. Partial markers: INSDC will use partial=start,
    partial=end and partial=start,end (Terence Murphy, NCBI, in
    SO-Ontologies#685), replacing the GVF-derived start_range and end_range
    that NCBI has used; both, and partial=true, are honoured. A partial 5' end
    exempts this check, a partial 3' end exempts BIO-007, and either exempts
    BIO-009; exempted checks are counted in BIO-011. start_range and end_range
    refer to the low and high genomic ends. Until the INSDC draft says whether
    start and end are genomic or 5'/3', partial=start or partial=end on a minus-
    strand CDS exempts both ends. A CDS
    whose first segment has phase 1 or 2 starts inside a codon by definition and
    is not judged, and a codon with bases other than A, C, G and T is not
    judged. The default table is 1 (--translation-table N; bacteria, archaea and
    plastids use 11); tables 27, 28 and 31 are not offered because their stop
    codons depend on context. Translation exceptions follow the SO/NCBI
    discussion in SO-Ontologies#658 (pending SO confirmation, question 17): a
    codon wholly covered by a recoded_codon (SO:0000145) feature, or a subtype
    (stop_codon_read_through SO:0000883, stop_codon_redefined_as_selenocysteine
    SO:0000885, stop_codon_redefined_as_pyrrolysine SO:0000884), whose Parent is
    the CDS, is exempt; such a feature carries recoded_amino_acid=<amino acid
    name> and may be split across a splice junction as several lines with one
    ID. The legacy NCBI transl_except attribute on the CDS is honoured as a
    fallback. With the SO layer, recoded_codon and every is_a subtype of it in
    the SO release count (by exact label or accession; the three subtypes
    above are always included), as do CDS subtypes for the CDS and exon
    subtypes for BIO-005; the recoded_amino_acid value is not checked yet.

- id: BIO-007
  level: warning
  layer: biology
  title: CDS ends with a stop codon
  description: When a CDS is complete, its last three bases are a stop codon under the chosen translation table.
  reference: {source: gff3, anchor: the-canonical-gene, section: "The Canonical Gene NOTE 5"}
  example: "CDS 1..90 on +, genome bases 88..90 are GGG"
  fix: Check the CDS end; mark partial CDS as such.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Stop codons completed by polyadenylation (some mitochondrial genes) need an
    exception. Implemented as a warning, with the same partial-CDS caveat as
    BIO-006. Not judged when the coding length is not a multiple of three
    (BIO-009 reports that) or when the phases are inconsistent (BIO-004). A stop
    codon completed by polyadenylation is exempt when marked as a recoded codon
    (see BIO-006); BIO-009 is then not reported if the recoded codon covers the
    trailing partial codon.

- id: BIO-008
  level: warning
  layer: biology
  title: No internal stop codons
  description: The translated CDS has no in-frame stop codon before its end.
  reference: {source: gff3, anchor: the-canonical-gene, section: The Canonical Gene}
  example: "CDS whose codon 10 is TAA under table 1"
  fix: Check exon boundaries and phases; mark selenocysteine, pyrrolysine or readthrough with a recoded_codon child of the CDS.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Selenocysteine, pyrrolysine and stop-codon readthrough are legitimate; how
    should they be annotated so the check can exempt them? Kept at warning, not
    error, because legitimate recoding still exists in files that do not mark
    it. Translation exceptions follow the SO/NCBI discussion in
    SO-Ontologies#658 (pending SO confirmation, question 17): a codon wholly
    covered by a recoded_codon (SO:0000145) feature, or a subtype
    (stop_codon_read_through SO:0000883, stop_codon_redefined_as_selenocysteine
    SO:0000885, stop_codon_redefined_as_pyrrolysine SO:0000884), whose Parent is
    the CDS, is exempt; such a feature carries recoded_amino_acid=<amino acid
    name> and may be split across a splice junction as several lines with one
    ID. The legacy NCBI transl_except attribute on the CDS is honoured as a
    fallback. With the SO layer, recoded_codon and every is_a subtype of it in
    the SO release count (by exact label or accession; the three subtypes
    above are always included), as do CDS subtypes for the CDS and exon
    subtypes for BIO-005; the recoded_amino_acid value is not checked yet. The last
    complete codon is the terminal codon (BIO-007), never internal. One finding
    per CDS gives the first internal stop and the count.

- id: BIO-009
  level: info
  layer: biology
  title: CDS length is a multiple of three
  description: The coding length of a complete CDS (sum of segment lengths minus the first segment's phase) is a multiple of three.
  reference: {source: gff3, anchor: description-of-the-format, section: "Column 8: phase"}
  example: "CDS segments 1..31 and 61..90 with phase 0"
  fix: Check the coordinates.
  status: implemented
  review: pending-SO
  notes: >-
    Coding lengths are computed from the coordinates, so the genome is needed
    only to run the layer. The specification's canonical gene has two such CDS
    (cds00001 with 2305 and cds00002 with 1402 coding bases), so the example
    itself is reported (see the suggested corrections in questions-for-SO.md).

- id: BIO-010
  level: warning
  layer: biology
  title: Strand is consistent within a gene
  description: The parts of a gene (transcripts, exons, CDS) are on the same strand as the gene.
  reference: {source: gff3, anchor: the-canonical-gene, section: The Canonical Gene}
  example: "ctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1\nctg1\t.\tmRNA\t1\t90\t.\t-\t.\tID=t1;Parent=g1"
  fix: Correct the strand.
  status: implemented
  review: pending-SO
  needs_so: true
  notes: >-
    Does not need the genome but runs with the biology layer. Trans-splicing and
    genes with strand "?" or "." are exceptions; error or warning? Implemented
    as a warning where both lines have strand + or -; the Parent's strand is
    that of its first line. As proposed in question 18, with the SO layer only
    Parent relations that SO-006 accepts (part_of or member_of, through is_a
    and transitivity) are checked; a relation SO-006 reports is skipped, and
    one involving a type the SO layer cannot resolve is still checked.
    Trans-splicing has no marker yet and is reported.

- id: BIO-011
  level: info
  layer: biology
  title: Biology checks skipped
  description: >-
    Reported when --genome was given but some biology checks could not run,
    with the reasons and counts (CDS on seqids not in the genome, on strand .
    or ?, with a missing phase, with lines on different seqids or strands,
    beyond the end of the sequence, or with inconsistent phases). Without
    --genome the whole biology layer is listed as not checked in the report.
    Skipped checks are never counted as passed.
  reference: {source: spec009, anchor: requirements-mandatory, section: FR-005}
  example: "chr1\t.\tCDS\t1\t90\t.\t.\t0\tID=c1   (with --genome; strand . has no 5' end)"
  fix: Follow the reason given, for example give each CDS a strand and a phase, or use the genome the annotation was made on.
  status: implemented
  review: pending-SO
  notes: >-
    Without --genome no finding is emitted (it would be on every file); the
    report's skipped list says that the biology layer needs --genome. Table 1 is
    used when --translation-table is not given; the table is never inferred.

# --------------------------------------------------------------------------
# FHGFF3 header (optional; FAIR-bioHeaders)
# --------------------------------------------------------------------------

- id: HDR-001
  level: error
  layer: fhgff3
  title: FHGFF3 header present when required
  description: >-
    With --require-header the file must carry a FAIR-bioHeaders header (#~
    lines). Without the option a file without a header is plain GFF3 and valid.
  reference: {source: spec007, anchor: requirements-mandatory, section: FR-001}
  example: "gff3-validate --require-header plain.gff3"
  fix: Add a header with the FAIR-bioHeaders toolkit, or drop --require-header.
  status: implemented
  review: pending-SO

- id: HDR-002
  level: info
  layer: fhgff3
  title: FHGFF3 header present but not validated
  description: >-
    The file has #~ header lines, but header validation is not available in
    this version (it needs the headers extra and FHGFF3 support in the
    FAIR-bioHeaders toolkit). The header is neither accepted nor rejected.
  reference: {source: spec009, anchor: requirements-mandatory, section: FR-006}
  example: "##gff-version 3\n#~schema: https://...\nctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1"
  fix: None in this version; validate the header with the toolkit when FHGFF3 support is released.
  status: implemented
  review: pending-SO

- id: HDR-003
  level: info
  layer: fhgff3
  title: Header checks skipped (--no-header)
  description: 'Header checks were skipped on request; #~ lines are treated as ordinary comments.'
  reference: {source: spec009, anchor: requirements-mandatory, section: FR-006}
  example: "gff3-validate --no-header annotated.gff3"
  fix: None needed.
  status: implemented
  review: pending-SO

- id: HDR-004
  level: error
  layer: fhgff3
  title: 'Header forms the leading block after ##gff-version'
  description: >-
    The first line stays ##gff-version 3; #~ lines follow it and form the
    leading header block, which ends at the first feature line or ##FASTA.
    ##sequence-region and other ## directives and comments may appear among
    the #~ lines. A #~ line later in the file (for example from concatenation)
    makes the file invalid FHGFF3 (R10).
  reference: {source: spec007, anchor: requirements-mandatory, section: "FR-001; FORMAT.md R10"}
  example: "##gff-version 3\nctg1\t.\tgene\t1\t90\t.\t+\t.\tID=g1\n#~checksum: ..."
  fix: Strip the header and combine it again with the FAIR-bioHeaders toolkit.
  status: planned
  review: pending-SO
  notes: Delegated to the FAIR-bioHeaders toolkit once it supports GFF3; not a GFF3 core rule.

- id: HDR-005
  level: error
  layer: fhgff3
  title: Header checksum verifies
  description: >-
    Exactly one root-level #~checksum line; SHA-512/256 over the exact
    decompressed bytes of the whole file, including any ##FASTA section,
    excluding that line, in padded base64 (R1 to R5).
  reference: {source: fhr-format, anchor: "", section: "R1 to R5"}
  example: "#~checksum: (value that does not match the file)"
  fix: If the annotation changed on purpose, recompute the header with the toolkit; otherwise the file was altered.
  status: planned
  review: pending-SO

- id: HDR-006
  level: error
  layer: fhgff3
  title: Header lines are safe YAML
  description: Header lines are UTF-8 without YAML line-break characters; no byte order mark; no duplicate keys, anchors, aliases or merge keys (R6 to R8).
  reference: {source: fhr-format, anchor: "", section: "R6 to R8"}
  example: "#~name: a\n#~name: b"
  fix: Remove the duplicate or unsafe construct.
  status: planned
  review: pending-SO

- id: HDR-007
  level: error
  layer: fhgff3
  title: Header metadata matches the FHR schema
  description: The header metadata validates against the FAIR-bioHeaders schema for the FHGFF3 subject (annotation).
  reference: {source: spec007, anchor: requirements-mandatory, section: "FR-003, FR-004"}
  example: "#~annotation: (missing required fields)"
  fix: Add the required fields reported by the schema.
  status: planned
  review: pending-SO

- id: HDR-008
  level: error
  layer: fhgff3
  title: derivedFrom identifies the annotated genome
  description: >-
    FHGFF3 requires derivedFrom with relationship "annotates", giving either the
    genome's FHR checksum or its accession plus SeqCol ID.
  reference: {source: spec007, anchor: requirements-mandatory, section: FR-003}
  example: "#~derivedFrom: [] "
  fix: Record the genome's FHR checksum, or its accession and SeqCol ID.
  status: planned
  review: pending-SO

- id: HDR-009
  level: error
  layer: fhgff3
  title: derivedFrom matches the supplied genome
  description: >-
    With --genome, the genome's FHR checksum (or SeqCol ID, when that is what
    the header records) matches derivedFrom. An accession plus SeqCol ID is
    not an FHR file checksum and is reported as such.
  reference: {source: spec007, anchor: requirements-mandatory, section: "FR-003; spec 009 FR-006"}
  example: "gff3-validate --genome other_assembly.fa annotated.gff3"
  fix: Use the genome named in the header.
  status: planned
  review: pending-SO
