name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install
      - name: Test
        run: poetry run pytest
      - name: Conformance suite is up to date and the CLI passes it (full findings)
        run: poetry run python scripts/check_conformance.py --gff3-validate gff3-validate
      - name: Rule catalogue, docs/rules.md and README rule list are in sync
        run: poetry run python scripts/render_rules.py --check
      - name: Lint and formatting
        run: |
          poetry run ruff check .
          poetry run isort . --check-only
          poetry run black . --check
      - name: Build wheel and source distribution
        run: poetry build
      - name: Check the built wheel installs and runs outside the checkout
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/gff3-validate --version
          /tmp/wheel-check/bin/gff3-validate "$GITHUB_WORKSPACE/tests/fixtures/valid/canonical_gene.gff3"

  web:
    # The in-browser page's engine (the wheel in Pyodide, through web/glue.js)
    # must give the same JSON, SARIF and HTML reports as the CLI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install
      - name: Build web/dist
        run: poetry run python scripts/build_web.py
      - name: Pyodide parity with the CLI
        run: |
          (cd web/test && npm ci --no-audit --no-fund)
          node web/test/parity.mjs --python "poetry run python"
