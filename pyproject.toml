[tool.poetry]
name = "gff3-validator"
# Pre-release: not to be published until the rule catalogue is reviewed with the
# Sequence Ontology group (FHR-Specification #62).
version = "0.1.0"
description = "One-stop GFF3 validator: GFF3 1.26 syntax, structure and Sequence Ontology rules, plus optional FAIR-bioHeaders (FHGFF3) header checks"
authors = ["Adam Wright <adam.wright@oicr.on.ca>", "David Molik <david.molik@usda.gov>"]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://github.com/FAIR-bioHeaders/gff3-validator"
repository = "https://github.com/FAIR-bioHeaders/gff3-validator"
documentation = "https://github.com/FAIR-bioHeaders/gff3-validator/blob/main/docs/rules.md"
keywords = ["GFF3", "validator", "Sequence Ontology", "genome annotation", "FAIR"]
packages = [{include = "gff3_validator"}]
include = ["gff3_validator/catalogue.yaml", "gff3_validator/data/so.json.gz", "gff3_validator/data/so-release.json"]

[tool.poetry.dependencies]
python = "^3.9"
pyyaml = "^6.0.1"
# Optional: FAIR-bioHeaders (FHGFF3) header checks. Core GFF3 validation never
# imports it. Install with: pip install "gff3-validator[headers]"
fair-bioheaders = {version = ">=0.4,<0.5", optional = true}

[tool.poetry.extras]
headers = ["fair-bioheaders"]

[tool.poetry.group.dev.dependencies]
isort = "^5.13.2"
black = [
    { version = "^26.3.1", python = ">=3.10" },
    { version = ">=24.3.0,<26", python = "<3.10" },
]
ruff = "^0.2.1"
# pytest 9.0.3 fixes CVE-2025-71176 but needs Python 3.10; 8.4 is the newest for 3.9.
pytest = [
    { version = "^9.0.3", python = ">=3.10" },
    { version = "^8.4.2", python = "<3.10" },
]
jsonschema = ">=4.17"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/FAIR-bioHeaders/gff3-validator/issues"
"Specification" = "https://github.com/FAIR-bioHeaders/FHR-Specification/blob/main/specs/009-gff3-validator/spec.md"

[tool.poetry.scripts]
gff3-validate = "gff3_validator.cli:main"

[build-system]
requires = ["poetry-core>=1.8,<3"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py39"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
