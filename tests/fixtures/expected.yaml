# Expected rule ids for each fixture, taken from the catalogue rules (not from
# any validator's output). Tests check the rules marked implemented; the other
# ids document what the planned rules must report. Info-level findings that
# every file gets (for example HDR-002 on a file with a header) are listed too.
# A file is expected to be valid (no errors) when none of its rules is an
# error; warnings and notes do not make a file invalid.
# nucleotide_to_protein_match, from the specification's Gap example, is not an
# SO term (SO-001, a warning until SO answers question 14).
